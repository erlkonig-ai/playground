# Install as /usr/local/etc/newsyslog.conf.d/playground_mcp.conf.
#
# Rotation is size-only. newsyslog sends SIGHUP to daemon(8)'s supervisor pid;
# the rc service runs daemon with -H, so it closes and reopens the output file
# without restarting the provider or interrupting jobs.
#
# logfilename                    owner:group mode count size when flags pidfile                         signal
/var/log/playground_mcp.log      root:wheel  600  7     10M  *    ZCE   /var/run/playground_mcp.pid     SIGHUP
